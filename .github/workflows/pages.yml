name: Publicar no GitHub Pages

on:
  push:
    branches: ["**"]
    paths:
      - "prototype/web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # Um push em branch de PR não pode substituir o jogo público. O fluxo
    # antigo publicava literalmente qualquer branch ("**").
    if: github.event_name == 'workflow_dispatch' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - name: Validar JavaScript
        run: find prototype/web/src -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Testar save e pipeline de assets
        run: |
          node --test prototype/web/tests/*.test.js
          python3 -m unittest discover -s prototype/web/tests -p 'test_*.py'

      - name: Preparar sprites do jogo
        run: python3 prototype/web/prepare_web_assets.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: prototype/web

      - id: deploy
        uses: actions/deploy-pages@v4
