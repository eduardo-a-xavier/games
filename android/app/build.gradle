plugins { id "com.android.application" }

android {
  namespace "br.com.encantaria"
  compileSdk 34

  defaultConfig {
    applicationId "br.com.encantaria"
    minSdk 24
    targetSdk 34
    versionCode 5
    versionName "0.5"
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}

dependencies {
  /*
   * Alinha TODAS as versões do stdlib do Kotlin. Sem isso o build quebra em
   * checkDebugDuplicateClasses: as dependências do AndroidX trazem
   * kotlin-stdlib numa versão e os artefatos kotlin-stdlib-jdk7/jdk8 numa
   * versão antiga, e a partir do Kotlin 1.8 o stdlib principal absorveu o
   * conteúdo desses dois — ter os dois lados no classpath duplica as
   * mesmas classes. O BOM força os três à mesma versão, onde jdk7/jdk8 são
   * apenas cascas vazias que apontam para o principal.
   */
  implementation platform("org.jetbrains.kotlin:kotlin-bom:1.9.24")

  implementation "androidx.appcompat:appcompat:1.7.0"
  implementation "androidx.core:core:1.13.1"
  implementation "androidx.webkit:webkit:1.11.0"
}

/*
 * O jogo NÃO é duplicado no repositório: esta tarefa copia
 * prototype/web/ para dentro dos assets do APK na hora de compilar.
 * Assim existe uma fonte só da verdade — mexer no jogo e recompilar já
 * leva a mudança pro app, sem ninguém precisar lembrar de sincronizar.
 */
tasks.register("copyGame", Copy) {
  from("$rootDir/../prototype/web") {
    exclude "dist/**"
    exclude "**/*.py"
  }
  into layout.buildDirectory.dir("gameAssets/www")
}

android.sourceSets.main.assets.srcDirs += [layout.buildDirectory.dir("gameAssets").get().asFile]

tasks.named("preBuild") { dependsOn("copyGame") }
